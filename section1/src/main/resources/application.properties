spring.application.name=section1

# If username property is not provided in properties, then default username is "user"
# If password property is not provided in properties, then default password is printed on the console during application startup
spring.security.user.name=lokesh
spring.security.user.password=mittal

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

logging.level.org.springframework.security=trace